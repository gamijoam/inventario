name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

# Variables de entorno globales para Telegram
env:
  TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Tests del frontend
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteria_refactor/frontend_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ferreteria_refactor/frontend_web/package-lock.json

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Correr tests
        run: npx jest src/__tests__/ --no-coverage --ci

      - name: ❌ Notificar tests fallados
        if: failure()
        run: |
          python3 -c "
          import json,urllib.request,os
          msg = '🧪 *Tests fallaron*\n\nDeploy bloqueado.\nhttps://github.com/gamijoam/inventario/actions'
          data = json.dumps({'chat_id':os.environ['TG_CHAT'],'text':msg,'parse_mode':'Markdown'}).encode()
          req = urllib.request.Request('https://api.telegram.org/bot'+os.environ['TG_TOKEN']+'/sendMessage',data=data,headers={'Content-Type':'application/json'})
          print(json.loads(urllib.request.urlopen(req,timeout=10).read()).get('ok'))
          "

  # ──────────────────────────────────────────────
  # JOB 2: Build y push imágenes Docker
  # ──────────────────────────────────────────────
  build:
    name: 🔨 Build imágenes
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generar versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')
          VERSION="prod-${DESC}-$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.prod
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: ✅ Notificar build listo — botones Telegram
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS="$(git log --oneline -5 --pretty='• %s' | head -5)"
          python3 -c "
          import json,urllib.request,os,sys
          version = os.environ['VERSION']
          commits = os.environ['COMMITS']
          payload = {
            'chat_id': os.environ['TG_CHAT'],
            'parse_mode': 'Markdown',
            'text': f'🔨 *Build listo para deploy*\n\nVersion: \`{version}\`\n\n*Cambios:*\n{commits}\n\n¿Desplegar a producción?',
            'reply_markup': {'inline_keyboard': [[
              {'text': '✅ Aprobar deploy', 'callback_data': f'approve:{version}'},
              {'text': '❌ Cancelar',       'callback_data': f'cancel:{version}'}
            ]]}
          }
          data = json.dumps(payload).encode()
          req  = urllib.request.Request(
            'https://api.telegram.org/bot'+os.environ['TG_TOKEN']+'/sendMessage',
            data=data, headers={'Content-Type':'application/json'})
          r = json.loads(urllib.request.urlopen(req,timeout=10).read())
          print('✅ Botones enviados a Telegram' if r.get('ok') else f'❌ {r}')
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMITS: ${{ github.event.head_commit.message }}

      - name: ❌ Notificar build fallido
        if: failure()
        run: |
          python3 -c "
          import json,urllib.request,os
          msg = '❌ *Build fallido*\n\nRevisa el error en GitHub Actions:\nhttps://github.com/gamijoam/inventario/actions'
          data = json.dumps({'chat_id':os.environ['TG_CHAT'],'text':msg,'parse_mode':'Markdown'}).encode()
          req = urllib.request.Request('https://api.telegram.org/bot'+os.environ['TG_TOKEN']+'/sendMessage',data=data,headers={'Content-Type':'application/json'})
          print(json.loads(urllib.request.urlopen(req,timeout=10).read()).get('ok'))
          "
