name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build y push de imágenes Docker
  # Se ejecuta automáticamente en cada push a main
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build imágenes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Generar versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            cut -c1-30 | sed 's/-*$//')
          VERSION="prod-${DESC}-$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.prod
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      # Notificar en Telegram con botones de aprobación
      - name: Notificar build listo → botones en Telegram
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS=$(git log --oneline -5 --pretty="• %s" | head -5)
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"parse_mode\": \"Markdown\",
              \"text\": \"🔨 *Build listo para deploy*\n\nVersión: \`${VERSION}\`\n\n*Cambios:*\n${COMMITS}\n\n¿Desplegar a producción?\",
              \"reply_markup\": {
                \"inline_keyboard\": [[
                  {\"text\": \"✅ Aprobar deploy\", \"callback_data\": \"approve:${VERSION}\"},
                  {\"text\": \"❌ Cancelar\", \"callback_data\": \"cancel:${VERSION}\"}
                ]]
              }
            }"

      - name: Notificar fallo de build
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"❌ *Build fallido*\n\nRevisa GitHub Actions para ver el error.\",
              \"parse_mode\": \"Markdown\"
            }"
