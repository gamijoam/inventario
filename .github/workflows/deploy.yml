name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Tests + Build frontend
  # ─────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteria_refactor/frontend_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 🧪 Tests
        run: npx jest src/__tests__/ --no-coverage --ci

      - name: 🔨 Build
        run: npx vite build
        env:
          VITE_API_URL: https://api.miinventariofacil.com/api/v1
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Subir dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ferreteria_refactor/frontend_web/dist
          retention-days: 1

      - name: ❌ Notificar fallo
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json,urllib.request,os
          t=os.environ.get('BOT_TOKEN','')
          c=os.environ.get('CHAT_ID','')
          if not t or not c: print('Secretos vacios'); exit()
          d=json.dumps({'chat_id':c,'text':'\u274c *Frontend fallido*\nhttps://github.com/gamijoam/inventario/actions','parse_mode':'Markdown'}).encode()
          r=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+t+'/sendMessage',d,{'Content-Type':'application/json'}),timeout=10).read())
          print('OK' if r.get('ok') else r)
          "

  # ─────────────────────────────────────────────
  # JOB 2: Build y push imágenes Docker
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Docker Images
    runs-on: ubuntu-latest
    needs: frontend
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar dist frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ferreteria_refactor/frontend_web/dist

      - name: Versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')
          echo "version=prod-${DESC}-$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐍 Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: 🎨 Frontend
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.ci
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}

      - name: 🌐 Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: 🔧 Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: ✅ Listo — Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -c "
          import json,urllib.request,os
          t=os.environ.get('BOT_TOKEN','')
          c=os.environ.get('CHAT_ID','')
          v=os.environ.get('VERSION','')
          if not t or not c: print('Secretos vacios'); exit()
          payload={
            'chat_id':c,'parse_mode':'Markdown',
            'text':f'\U0001f528 *Build listo*\n\nVersion: \`{v}\`\n\n\u00bfDesplegar a producci\u00f3n?',
            'reply_markup':{'inline_keyboard':[[
              {'text':'\u2705 Aprobar','callback_data':f'approve:{v}'},
              {'text':'\u274c Cancelar','callback_data':f'cancel:{v}'}
            ]]}
          }
          d=json.dumps(payload).encode()
          r=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+t+'/sendMessage',d,{'Content-Type':'application/json'}),timeout=10).read())
          print('Botones enviados' if r.get('ok') else r)
          "

      - name: ❌ Falló — Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json,urllib.request,os
          t=os.environ.get('BOT_TOKEN','')
          c=os.environ.get('CHAT_ID','')
          if not t or not c: print('Secretos vacios'); exit()
          d=json.dumps({'chat_id':c,'text':'\u274c *Build Docker fallido*\nhttps://github.com/gamijoam/inventario/actions','parse_mode':'Markdown'}).encode()
          r=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+t+'/sendMessage',d,{'Content-Type':'application/json'}),timeout=10).read())
          print('OK' if r.get('ok') else r)
          "
