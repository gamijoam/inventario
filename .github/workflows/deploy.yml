name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build y push de imágenes Docker
  # Se ejecuta automáticamente en cada push a main
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build imágenes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Generar versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            cut -c1-30 | sed 's/-$//')
          VERSION="prod-${DESC}-$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.prod
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}
          build-args: |
            VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: |
            VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: |
            VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Notificar build listo en Telegram
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS=$(git log --oneline -5 --pretty="• %s")
          MSG="🔨 *Build listo para deploy*%0A%0AVersionión: \`${VERSION}\`%0A%0A*Cambios incluidos:*%0A${COMMITS}%0A%0A⏳ Esperando tu aprobación para desplegarlo..."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null

  # ─────────────────────────────────────────────
  # JOB 2: Deploy con aprobación manual
  # Solo se ejecuta cuando TÚ apruebes en GitHub
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy a producción
    runs-on: ubuntu-latest
    needs: build
    environment: production   # ← Aquí está la aprobación manual
    
    steps:
      - name: Notificar inicio de deploy
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          MSG="🚀 *Deployando a producción...*%0A%0AVersionión: \`${VERSION}\`"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null

      - name: Deploy al VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            VERSION="${{ needs.build.outputs.version }}"
            echo "TAG=$VERSION" >> /tmp/deploy_env
            
            # Guardar TAG anterior para rollback
            OLD_TAG=$(grep "^TAG=" /root/deploy/prod/.env | cut -d= -f2)
            echo "Tag anterior: $OLD_TAG"
            
            # Actualizar TAG
            sed -i "s/^TAG=.*/TAG=$VERSION/" /root/deploy/prod/.env
            
            # Recrear contenedores con la regla de web_publica primero
            docker stop backend_prod_server   && docker rm backend_prod_server
            docker run -d --name backend_prod_server --restart always \
              --network web_publica \
              --env-file /root/deploy/prod/.env \
              -v /root/deploy/prod/data/media:/app/media \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.backend-prod.rule=Host(\`api.miinventariofacil.com\`)" \
              --label "traefik.http.routers.backend-prod.entrypoints=websecure" \
              --label "traefik.http.routers.backend-prod.tls.certresolver=myresolver" \
              --label "traefik.http.services.backend-prod.loadbalancer.server.port=8000" \
              --label "traefik.docker.network=web_publica" \
              gamijoam/ferreteria-backend:$VERSION
            sleep 5
            docker network connect prod_prod_internal backend_prod_server

            docker stop frontend_prod_server  && docker rm frontend_prod_server
            docker run -d --name frontend_prod_server --restart always \
              --network web_publica \
              --env-file /root/deploy/prod/.env \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.frontend-prod.rule=HostRegexp(\`{subdomain:[a-z0-9-]+}.miinventariofacil.com\`)" \
              --label "traefik.http.routers.frontend-prod.entrypoints=websecure" \
              --label "traefik.http.routers.frontend-prod.tls.certresolver=myresolver" \
              --label "traefik.http.services.frontend-prod.loadbalancer.server.port=80" \
              --label "traefik.http.routers.frontend-prod.priority=1" \
              --label "traefik.docker.network=web_publica" \
              gamijoam/ferreteria-app:$VERSION

            docker stop landing_prod_server   && docker rm landing_prod_server
            docker run -d --name landing_prod_server --restart always \
              --network web_publica \
              --env-file /root/deploy/prod/.env \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.landing-prod.rule=Host(\`miinventariofacil.com\`,\`www.miinventariofacil.com\`)" \
              --label "traefik.http.routers.landing-prod.entrypoints=websecure" \
              --label "traefik.http.routers.landing-prod.tls.certresolver=myresolver" \
              --label "traefik.http.services.landing-prod.loadbalancer.server.port=80" \
              --label "traefik.docker.network=web_publica" \
              gamijoam/ferreteria-landing:$VERSION

            docker stop admin_panel_prod_server && docker rm admin_panel_prod_server
            docker run -d --name admin_panel_prod_server --restart always \
              --network web_publica \
              --env-file /root/deploy/prod/.env \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.admin-prod.rule=Host(\`admin.miinventariofacil.com\`)" \
              --label "traefik.http.routers.admin-prod.entrypoints=websecure" \
              --label "traefik.http.routers.admin-prod.tls.certresolver=myresolver" \
              --label "traefik.http.services.admin-prod.loadbalancer.server.port=80" \
              --label "traefik.http.routers.admin-prod.priority=100" \
              --label "traefik.docker.network=web_publica" \
              gamijoam/ferreteria-admin-panel:$VERSION
            
            echo "✅ Contenedores recreados con $VERSION"

      - name: Smoke tests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Esperando 30s para que los servicios arranquen..."
            sleep 30
            
            FAILED=0
            for url in \
              "https://api.miinventariofacil.com/api/v1/health" \
              "https://oscarcell.miinventariofacil.com" \
              "https://admin.miinventariofacil.com"; do
              CODE=$(curl -s --max-time 10 "$url" -o /dev/null -w "%{http_code}" || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "✅ $url → $CODE"
              else
                echo "❌ $url → $CODE"
                FAILED=$((FAILED + 1))
              fi
            done
            
            if [ $FAILED -gt 0 ]; then
              echo "❌ $FAILED servicios fallaron"
              exit 1
            fi

      - name: Notificar éxito
        if: success()
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          MSG="✅ *Deploy exitoso*%0A%0AVersionión: \`${VERSION}\`%0A%0ATodos los servicios están funcionando correctamente 🎉"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null

      - name: Notificar fallo y rollback
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            OLD_TAG=$(cat /tmp/deploy_env | grep OLD_TAG | cut -d= -f2 || echo "")
            if [ -n "$OLD_TAG" ]; then
              sed -i "s/^TAG=.*/TAG=$OLD_TAG/" /root/deploy/prod/.env
              echo "⚠️ Rollback a $OLD_TAG iniciado"
            fi
            # Notificar por Telegram
            MSG="❌ *Deploy fallido — Rollback ejecutado*%0A%0ASe revirtió a la versión anterior automáticamente."
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null
