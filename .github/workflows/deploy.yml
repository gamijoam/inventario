name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Tests del frontend
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteria_refactor/frontend_web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ferreteria_refactor/frontend_web/package-lock.json

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Correr tests
        run: npx jest src/__tests__/ --no-coverage --ci

  # ──────────────────────────────────────────────
  # JOB 2: Build y push imágenes Docker
  # ──────────────────────────────────────────────
  build:
    name: 🔨 Build imágenes
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generar versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            cut -c1-30 | sed 's/-*$//')
          VERSION="prod-${DESC}-$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.prod
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: Build y push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      # Notificar en Telegram con botones de aprobación
      - name: ✅ Notificar build listo
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS=$(git log --oneline -5 --pretty="• %s")
          python3 - << PYEOF
          import json, urllib.request
          payload = {
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "parse_mode": "Markdown",
            "text": (
              "🔨 *Build listo para deploy*\n\n"
              "Versión: \`${VERSION}\`\n\n"
              "*Cambios:*\n${COMMITS}\n\n"
              "¿Desplegar a producción?"
            ),
            "reply_markup": {"inline_keyboard": [[
              {"text": "✅ Aprobar deploy", "callback_data": "approve:${VERSION}"},
              {"text": "❌ Cancelar",       "callback_data": "cancel:${VERSION}"}
            ]]}
          }
          req = urllib.request.Request(
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=10) as r:
            d = json.loads(r.read())
            print("✅ Telegram OK" if d.get("ok") else f"❌ {d}")
          PYEOF

      # Notificar fallo — cualquier job que falle
      - name: ❌ Notificar fallo
        if: failure()
        run: |
          python3 - << PYEOF
          import json, urllib.request
          payload = {
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "parse_mode": "Markdown",
            "text": "❌ *Build fallido*\n\nRevisa los errores en GitHub Actions:\nhttps://github.com/gamijoam/inventario/actions"
          }
          req = urllib.request.Request(
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=10) as r:
            d = json.loads(r.read())
            print("✅ Alerta enviada" if d.get("ok") else f"❌ {d}")
          PYEOF

  # ──────────────────────────────────────────────
  # Notificar fallo de tests
  # ──────────────────────────────────────────────
  notify-test-failure:
    name: ❌ Notificar fallo de tests
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Avisar en Telegram
        run: |
          python3 - << PYEOF
          import json, urllib.request
          payload = {
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "parse_mode": "Markdown",
            "text": "🧪 *Tests fallaron*\n\nAlgún test del frontend está roto.\nDeploy bloqueado hasta que se corrijan.\n\nhttps://github.com/gamijoam/inventario/actions"
          }
          req = urllib.request.Request(
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=10) as r:
            d = json.loads(r.read())
            print("Alerta enviada" if d.get("ok") else str(d))
          PYEOF
