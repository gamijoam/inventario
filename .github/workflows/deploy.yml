name: 🚀 Deploy — Mi Inventario Fácil

on:
  push:
    branches: [main]

env:
  TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Tests + Build frontend
  # ──────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferreteria_refactor/frontend_web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps

      - name: 🧪 Correr tests
        run: npx jest src/__tests__/ --no-coverage --ci

      - name: 🔨 Build frontend
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "CI=$CI"
          npm run build 2>&1 || {
            echo "=== BUILD FAILED ==="
            exit 1
          }
        env:
          VITE_API_URL: https://api.miinventariofacil.com/api/v1
          NODE_OPTIONS: --max-old-space-size=4096
          CI: ""

      - name: Subir dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ferreteria_refactor/frontend_web/dist
          retention-days: 1

      - name: ❌ Notificar fallo frontend
        if: failure()
        run: |
          python3 -c "
          import json,urllib.request,os
          msg='🧪 *Frontend fallido*\n\nTests o build del frontend tienen errores.\nhttps://github.com/gamijoam/inventario/actions'
          data=json.dumps({'chat_id':os.environ.get('TG_CHAT',''),'text':msg,'parse_mode':'Markdown'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ.get('TG_TOKEN','')+'/sendMessage',data=data,headers={'Content-Type':'application/json'})
          try:
            print(json.loads(urllib.request.urlopen(req,timeout=10).read()).get('ok'))
          except Exception as e:
            print(f'Telegram error: {e}')
          "

  # ──────────────────────────────────────────────
  # JOB 2: Build y push todas las imágenes Docker
  # ──────────────────────────────────────────────
  build:
    name: 🔨 Build imágenes Docker
    runs-on: ubuntu-latest
    needs: frontend
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Descargar dist del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ferreteria_refactor/frontend_web/dist

      - name: Generar versión
        id: version
        run: |
          DESC=$(git log -1 --pretty=%s | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')
          VERSION="prod-${DESC}-$(date +%Y%m%d%H%M)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: gamijoam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐍 Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ferreteria_refactor/backend_api/Dockerfile
          push: true
          tags: gamijoam/ferreteria-backend:${{ steps.version.outputs.version }}

      - name: 🎨 Build y push Frontend (dist pre-compilado)
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/frontend_web
          file: ferreteria_refactor/frontend_web/Dockerfile.ci
          push: true
          tags: gamijoam/ferreteria-app:${{ steps.version.outputs.version }}

      - name: 🌐 Build y push Landing
        uses: docker/build-push-action@v5
        with:
          context: landing_page
          push: true
          tags: gamijoam/ferreteria-landing:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: 🔧 Build y push Admin Panel
        uses: docker/build-push-action@v5
        with:
          context: ferreteria_refactor/saas_admin
          file: ferreteria_refactor/saas_admin/Dockerfile
          push: true
          tags: gamijoam/ferreteria-admin-panel:${{ steps.version.outputs.version }}
          build-args: VITE_API_URL=https://api.miinventariofacil.com/api/v1

      - name: ✅ Build listo — enviar botones a Telegram
        if: success()
        run: |
          python3 -c "
          import json,urllib.request,os
          version='${{ steps.version.outputs.version }}'
          msg=f'🔨 *Build listo para deploy*\n\nVersion: \`{version}\`\n\n¿Desplegar a producción?'
          payload={
            'chat_id':os.environ.get('TG_CHAT',''),
            'parse_mode':'Markdown',
            'text':msg,
            'reply_markup':{'inline_keyboard':[[
              {'text':'✅ Aprobar deploy','callback_data':f'approve:{version}'},
              {'text':'❌ Cancelar','callback_data':f'cancel:{version}'}
            ]]}
          }
          data=json.dumps(payload).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ.get('TG_TOKEN','')+'/sendMessage',data=data,headers={'Content-Type':'application/json'})
          try:
            r=json.loads(urllib.request.urlopen(req,timeout=10).read())
            print('✅ Botones enviados' if r.get('ok') else f'❌ {r}')
          except Exception as e:
            print(f'Error Telegram: {e}')
          "

      - name: ❌ Build fallido — notificar Telegram
        if: failure()
        run: |
          python3 -c "
          import json,urllib.request,os
          msg='❌ *Build Docker fallido*\n\nhttps://github.com/gamijoam/inventario/actions'
          data=json.dumps({'chat_id':os.environ.get('TG_CHAT',''),'text':msg,'parse_mode':'Markdown'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ.get('TG_TOKEN','')+'/sendMessage',data=data,headers={'Content-Type':'application/json'})
          try:
            print(json.loads(urllib.request.urlopen(req,timeout=10).read()).get('ok'))
          except Exception as e:
            print(f'Error: {e}')
          "
