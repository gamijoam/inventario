[IDENTIDAD]
# Configuración de Identidad SaaS
# tenant_id: El subdominio o ID de tu empresa (ej: ferreteria-juan)
# client_id: El nombre único de esta caja (ej: caja-principal, caja-2)
# auth_token: Token de seguridad (API Key) generado en el panel administrativo
tenant_id = demo-tenant
client_id = caja-1
auth_token = TOKEN_DE_PRUEBA_12345

[SERVIDOR]
# URL del servidor WebSocket (wss:// para HTTPS, ws:// para HTTP)
# Primary: Servidor VPS (Producción)
url_primary = wss://demo.invensoft.lat

# Secondary: Servidor Local (Desarrollo / Fallback)
url_secondary = ws://localhost:8000

[IMPRESORAS]
# Definición de impresoras lógicas mapeadas a impresoras físicas de Windows
# Formato: nombre_logico = Nombre en Windows
# Nombres lógicos reservados: default, caja, cocina, barra

# Impresora por defecto
default = POS-58

# Impresora para Tickets de Venta
caja = POS-58

# Impresora para Comandas de Cocina
cocina = EPSON TM-U220 Receipt

[CONFIG]
# Modo de impresión:
#   WINDOWS  - Impresora instalada en Windows (recomendado)
#   VIRTUAL  - Solo muestra en consola y guarda en archivo txt (para pruebas)
#   ESCPOS   - Uso directo de comandos ESC/POS (avanzado)
modo = VIRTUAL
