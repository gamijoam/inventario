# ─────────────────────────────────────────────────────────────
# monitor.conf — Configuración del sistema de monitoreo
# Editar este archivo para cambiar el número de alertas
# ─────────────────────────────────────────────────────────────

# Número del administrador que recibe las alertas
# Formato: código de país + número SIN espacios SIN +
# Venezuela ejemplo: 584141234567
ADMIN_PHONE="584148529805"

# Segundos entre alertas del mismo servicio (evita spam)
# Default: 300 = 5 minutos
ALERT_COOLDOWN=300

# Porcentaje de disco que dispara la alerta
DISK_ALERT_THRESHOLD=85
