server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML — nunca cachear
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # JS y CSS con hash — caché agresivo
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Imágenes y fuentes
    location ~* \.(ico|gif|jpe?g|png|webp|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Descargas — servir archivos reales sin SPA fallback
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — todo lo demás va al index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
